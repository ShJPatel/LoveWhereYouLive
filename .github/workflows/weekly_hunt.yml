name: Weekly San Antonio Rental Hunt

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1' # Every Monday at 8:00 AM CDT

jobs:
  scrape-and-score:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Multi-Criteria Rental Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.pipeline

      - name: Commit updated rankings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/
          git diff --staged --quiet || git commit -m "chore: update weekly San Antonio rental rankings"
          git push
